<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>FOREIGN · 异物 — 在真实重建的房间里找出不属于这里的东西</title>
    <meta
      name="description"
      content="第一人称异常猎杀。房间是 Aholo 开源 3DGS 重建的真实空间，多出来的东西由 Aholo Lux3D 生成。找到它们，你只有三次标记机会。"
    />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body class="splat">
    <!-- The viewer owns its own canvas, so this is just its mount point. -->
    <div id="view"></div>

    <div id="crosshair" aria-hidden="true">
      <div class="ring"></div>
      <div class="dot"></div>
    </div>

    <div id="hud" class="hidden">
      <div class="hud-row">
        <div class="stat">
          <span class="label">楼层 FLOOR</span>
          <span class="value" id="hud-floor">1</span>
        </div>
        <div class="stat">
          <span class="label">异物 FOREIGN</span>
          <span class="value"><b id="hud-found">0</b>/<span id="hud-total">1</span></span>
        </div>
        <div class="stat">
          <span class="label">时间 TIME</span>
          <span class="value" id="hud-time">04:00</span>
        </div>
        <div class="stat">
          <span class="label">标记次数 MARKS</span>
          <span class="value marks" id="hud-marks">●●●</span>
        </div>
      </div>
      <div id="hud-toast" class="toast"></div>
      <div id="hud-perf" class="perf hidden" aria-live="off"></div>
      <div class="hint">
        标记<strong>不该存在</strong>的东西 · 家具做了家具做不到的事就是异常 · WASD 移动 · 左键标记 · Shift 疾走 · F 手电筒 · F3 画质 · Esc 暂停
      </div>
    </div>

    <!-- Darkness. A torch beam rather than a vignette: it is the player's only
         tool, and a tool that visibly stops being enough does more for dread
         than a room that is simply dim. -->
    <div id="dark" aria-hidden="true"></div>

    <!-- The fright. Inline SVG rather than a loaded image, so it appears on the
         frame it is asked for at any frame rate -- a jump scare that arrives
         late is not a jump scare. Abstract on purpose: a pale face with black
         sockets, no gore, which is both worse and reviewable. -->
    <div id="scare" aria-hidden="true">
      <svg viewBox="0 0 100 100" preserveAspectRatio="xMidYMid slice">
        <defs>
          <radialGradient id="scare-flesh" cx="50%" cy="42%" r="62%">
            <stop offset="0%" stop-color="#d8cfc4" />
            <stop offset="62%" stop-color="#8d8378" />
            <stop offset="100%" stop-color="#14100e" />
          </radialGradient>
          <radialGradient id="scare-socket" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#000" />
            <stop offset="70%" stop-color="#000" />
            <stop offset="100%" stop-color="#1a1410" stop-opacity="0" />
          </radialGradient>
        </defs>
        <rect width="100" height="100" fill="#050404" />
        <ellipse cx="50" cy="50" rx="29" ry="41" fill="url(#scare-flesh)" />
        <ellipse cx="39" cy="43" rx="8.4" ry="10.2" fill="url(#scare-socket)" />
        <ellipse cx="61.5" cy="44.5" rx="7.6" ry="9.4" fill="url(#scare-socket)" />
        <ellipse cx="50" cy="72" rx="7.5" ry="13" fill="#0a0708" />
        <ellipse cx="50" cy="69.5" rx="5.4" ry="3" fill="#2a1d1c" />
        <ellipse cx="39" cy="43" rx="1.5" ry="1.5" fill="#c9c0b4" opacity="0.55" />
        <ellipse cx="61.5" cy="44.5" rx="1.4" ry="1.4" fill="#c9c0b4" opacity="0.45" />
      </svg>
    </div>

    <div id="overlay" class="overlay"></div>

    <script type="module" src="/src/splat/main.ts"></script>
  </body>
</html>

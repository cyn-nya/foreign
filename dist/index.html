<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>FOREIGN · 异物 — 在真实重建的房间里找出不属于这里的东西</title>
    <meta
      name="description"
      content="第一人称异常猎杀。房间是 Aholo 开源 3DGS 重建的真实空间，多出来的东西由 Aholo Lux3D 生成。找到它们，你只有三次标记机会。"
    />
    <script type="module" crossorigin src="./assets/index-DhtEHMq2.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/modulepreload-polyfill-P2Xu9kJm.js">
    <link rel="modulepreload" crossorigin href="./assets/rules-CCLbYkPT.js">
    <link rel="modulepreload" crossorigin href="./assets/dist-DU0eRb85.js">
    <link rel="stylesheet" crossorigin href="./assets/rules-97M4B49G.css">
  </head>
  <body class="splat">
    <!-- The viewer owns its own canvas, so this is just its mount point. -->
    <div id="view"></div>

    <div id="crosshair" aria-hidden="true">
      <div class="ring"></div>
      <div class="dot"></div>
    </div>

    <div id="hud" class="hidden">
      <div class="hud-row">
        <div class="stat">
          <span class="label">楼层 FLOOR</span>
          <span class="value" id="hud-floor">1</span>
        </div>
        <div class="stat">
          <span class="label">异物 FOREIGN</span>
          <span class="value"><b id="hud-found">0</b>/<span id="hud-total">1</span></span>
        </div>
        <div class="stat">
          <span class="label">时间 TIME</span>
          <span class="value" id="hud-time">04:00</span>
        </div>
        <div class="stat">
          <span class="label">标记次数 MARKS</span>
          <span class="value marks" id="hud-marks">●●●</span>
        </div>
      </div>
      <div id="hud-toast" class="toast"></div>
      <div class="hint">
        只标记<strong>不属于这个家</strong>的东西 · WASD 移动 · 左键标记 · Shift 疾走 · Esc 暂停
      </div>
    </div>

    <div id="overlay" class="overlay"></div>

  </body>
</html>

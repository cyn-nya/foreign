name: Deploy demo to GitHub Pages

# Publishes the playable demo. The room itself is not in this repository — the
# 63 MB splat and the collision field are streamed at runtime from Aholo's
# public CDN — so the artifact is small and the only real risk is a path that
# works at a domain root and breaks under /<repo>/.
#
# `npm run deploy:check` reproduces exactly that condition locally before this
# ever runs.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The same gate used locally: types, unit tests, and the build.
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
